name: CI
on:
  push:
    branches:
      - main
      - smalleffv3part2
  pull_request:
    branches:
      - main
      - smalleffv3part2
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      T3_MOCK: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v
      - name: Run demo
        run: python demo/run_demo.py
